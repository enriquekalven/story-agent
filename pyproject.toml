[project]
name = "story-agent"
version = "0.2.0"
description = "Autonomous AI children's picture book and bilingual audio publishing pipeline (Curious Little Minds: Lily & Robo Adventures)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "Pillow",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "pydantic",
    "pyyaml",
    "python-dotenv",
    "websockets",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

# Always resolve from public PyPI, even on machines whose uv config points at a private
# mirror, so uv.lock stays installable by GitHub Actions, Cloud Build and Docker.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
