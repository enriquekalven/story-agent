[project]
name = "story-agent"
version = "0.2.0"
description = "Autonomous AI children's picture book and bilingual audio publishing pipeline (Curious Little Minds: Lily & Robo Adventures)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "google-adk",
    "Pillow",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "pydantic",
    "pyyaml",
    "python-dotenv",
    "pytest",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
